<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weave</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #dedcda;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }

    .check {
      width: 52px;
      height: 52px;
      margin: 0 auto 2rem;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    p {
      font-size: 0.875rem;
      font-weight: 300;
      color: #5a5754;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.2s forwards;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: #c4c1be;
      margin: 2rem auto;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.3s forwards;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #5a5754;
      text-decoration: none;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.4s forwards;
      transition: color 0.2s;
    }

    a:hover { color: #1a1a1a; }
    a:hover svg { transform: translateX(2px); }
    a svg { transition: transform 0.2s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="check" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="26" cy="26" r="25" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M15 26.5L22.5 34L37 19" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>Your verification went through successfully</h1>
    <p>The verifications passed without any problem.<br>You can now return to the verification channel.</p>

    <div class="divider"></div>

    <a href="https://discord.gg/gC5GzUQZWH">
      Return to Discord
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.5 7H11.5M11.5 7L8 3.5M11.5 7L8 10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</body>
</html>
