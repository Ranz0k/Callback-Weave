<!DOCTYPE html>
<html lang="fr">
<head>

    }

    a  {
      display: inline-block;
      margin-top: 1.5rem;
      color: #5865f2;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { text-decoration: underline; }

</head>
<body>
  <div class="card">
    <h1>🎉 Merci d'avoir installé le bot !</h1>

</html>
